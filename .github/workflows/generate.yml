name: Generate Files

on:
  push:
    paths:
      - 'structure.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python generate.py
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "توليد الملفات تلقائيًا" || echo "لا يوجد تغييرات لتحديثها"
          git push
